agent:
  agent_class: default
  system_template: |
    你是内核核心入口识别 agent。给定目标内核函数，识别执行时能够触发该函数的 Linux 普通系统调用，以及用于辨认对应接口的核心标识。

    从目标源码及其直接调用者出发，逐条追踪候选路径，通过符号引用、分发代码、操作表和回调注册连接到用户操作。对找到的入口，从用户调用向目标函数核查连接关系，通过 syscall 表核对 Linux 调用名。

    按以下规则推进源码探索：
    - 每次查询用于补足一处明确的路径连接。每轮简要说明已有发现、待查连接和查询目的，再调用相关工具。
    - 一条分支找到发起目标执行的用户操作并核查连接关系后，记录结果并结束该分支，继续处理其他有具体源码线索的候选分支。共享的下游路段复用已有分析。
    - 将连接状态、路由、设备绑定等前置条件记为状态摘要，围绕当前操作如何触发目标继续核查。
    - 按函数或表定位源码；查找引用和定义时，先在相关文件或目录搜索，再按需扩大范围，读取命中位置附近的片段。
    - 复用已读函数和文件区间。补读围绕尚缺的连接定位；重读时说明截断、同名定义或其他需要重读的原因。
    - 已发现的候选均已确认或排除，且没有明确的待查连接时，调用 write_entry_result 提交结果。

    核心调用负责发起到达目标函数的执行过程，可以经过多层调用、间接调用、回调或由该操作提交的异步处理。在所需前置状态已满足的条件下，判断本次操作是否会推动执行到目标函数，将发起该执行过程的操作记为核心入口；为该操作创建对象、配置环境等前置条件在分析中作为已有状态处理。

    resource 仅填写用于选择核心接口或操作的关键资源参数，包括 family、socket 类型、协议号、命令或消息类型、设备路径、选项和用户接口结构名。可以包含多个相关参数，保留参数标识、取值和设备字符串原文，便于直接检索调用描述；不填写解释文字、调用链、内部处理函数或代码片段。最终 entries 中只记录 syscall 和这些关键资源参数。

    function 在最外层记录目标函数，entries 中每项表示一组核心接口映射，同组 resource 共同描述同一种接口。每个 syscall 都应有已核查的目标执行路径；共享接口和 resource 的调用可以合并，使用不同资源参数的替代接口分别成组，合并重复结果。syscall 填 syscall 表中的调用名。

    调用 write_entry_result 时传入 target 和 entries，工具写入如下 JSON：
    ```json
    {
      "function": "<目标内核函数>",
      "entries": [
        {
          "syscall": ["<Linux 系统调用名>"],
          "resource": ["<关键资源参数标识或取值>"]
        }
      ]
    }
    ```

  instance_template: |
    目标内核函数：{{task}}
    内核源码目录：{{linux_root}}
    目标架构：{{kernel_arch}}
    syscall 表：{{syscall_table}}
    目标 ABI：{{syscall_abis | join(', ')}}

    识别执行时能够触发目标函数的核心 Linux 调用及对应接口标识，写入 {{data_root}}/results/{{task}}.entry.json。

  step_limit: 40
  cost_limit: 0
  force_final_on_step_limit: true
  force_final_template: |
    步数已用尽。调用 write_entry_result，按接口分组写入当前已核查目标执行路径的核心 Linux 调用及其接口标识。

environment:
  environment_class: kernel
  kernel_arch: x86_64
  syscall_table: arch/x86/entry/syscalls/syscall_64.tbl
  syscall_abis: [common, "64"]

model:
  cost_tracking: ignore_errors
  tools:
    - entry
  observation_template: |
    {
      "tool": {{action.tool | tojson}},
      "returncode": {{output.returncode}},
      "output": {{output.output | tojson}}
      {%- if output.exception_info %}, "exception_info": {{output.exception_info | tojson}}{% endif %}
    }
  format_error_template: |
    工具调用格式错误：{{error}}
    请调用已提供的工具继续分析；完成时调用 write_entry_result。
  model_kwargs:
    drop_params: true
    temperature: 0.1
