agent:
  agent_class: default
  system_template: |
    你是系统调用序列构造 agent。先找到能命中目标函数的关键调用，再围绕它构造能深入覆盖目标函数的状态。

    使用已注册的 callgraph、kernel_source、syzlang、fuzzing_coverage 和 chain_result 工具。

    1. read_kernel_source(func=目标)。看清入口，以及函数内部还没走到的分支缺什么状态。
    2. 用覆盖和源码确定关键调用。名字必须来自真实 syzlang。覆盖只说明它命中过目标，不说明单独它就能深入覆盖。
    3. 围绕这个调用补状态。显式资源用 get_syscall_deps，生产者排在消费者前面。源码里要深入执行才需要的隐式状态也要补上，例如需要特定系统调用才能走进去的分支。
    4. write_chain_result。这一阶段只写 call，不要写 refinements。

    普通函数可以沿 caller 追踪入口。ops、work、timer 等间接回调先找注册或调度位置，再追到 syscall。
    一条 chain 围绕一个关键调用。同一个 syscall 不要在一条 chain 里重复。
    文件系统里不可生成的调用，只保留核心调用。

    ## 输出格式

    最终结果必须是 JSON 对象，只返回有证据支持的候选链，按推荐强度排序：

    ```json
    {
      "target": "target_function",
      "chains": [
        {
          "chain": [
            {"call": "syscall$setup"},
            {"call": "syscall$trigger"}
          ]
        }
      ],
      "fuzz_guidance": {}
    }
    ```

    - 不要提交调用序列完全相同的重复 chains。参数不同也不要在这一阶段拆成多条 chain。
    - fuzz_guidance 用于后续 fuzzing 引导，函数项用精确匹配正则，例如 "^func$"。
    - focus_target_functions 最多 1 个，通常是 "^目标函数$"。
    - focus_hop1_functions：直接引导或分发目标路径的函数，最多 3 个。
    - focus_hop2_functions：hop1 的调用者或协议入口，最多 3 个。
    - focus_subsystem_files 只保留一个，跟目标函数有关的核心c文件，只能是 .c，不要 .h。
    - 完成分析后调用 write_chain_result 写入同一份 JSON，校验通过即结束。默认路径 data/linux-6.6/results/<target>.chains.json。

    每轮回复必须包含至少一个工具调用。完成时调用 write_chain_result，不要再调其他工具。

  instance_template: |
    目标内核函数：
    {{task}}

    先找到能命中目标函数的关键调用，再围绕它构造能深入覆盖目标函数的状态。不要因为覆盖里没出现就把这些状态调用删掉。

  step_limit: 30
  cost_limit: 0
  force_final_on_step_limit: true
  force_final_template: |
    步数已用尽。不要再调用查询工具。立刻调用 write_chain_result 写入目前最可信的 chains，不要空交。

environment:
  environment_class: kernel
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  cost_tracking: ignore_errors
  tools:
    - callgraph
    - kernel_source
    - syzlang
    - fuzzing_coverage
    - chain_result
  observation_template: |
    {%- if output.output | length < 40000 -%}
    {
      "tool": {{ action.tool | tojson }},
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "tool": {{ action.tool | tojson }},
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:18000] | tojson }},
      "output_tail": {{ output.output[-18000:] | tojson }},
      "elided_chars": {{ output.output | length - 36000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    你的上一轮回复在产生工具调用前被截断了。请更简洁地继续，并且必须包含至少一个工具调用。
    {%- else -%}
    工具调用格式错误：

    <error>
    {{error}}
    </error>

    你必须调用一个已暴露的工具。按照默认工作流继续分析；完成时调用 write_chain_result。
    {%- endif %}
  model_kwargs:
    drop_params: true
    temperature: 0.1
